<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 150vh;
            font-family: Arial, sans-serif;
            background: #5f9f55;
            overflow-y: auto;
        }

        //
        .top {
            height: 35vh;
            min-height: 280px;
            background: linear-gradient(
                to bottom,
                #205f2c 0%,
                #286b32 25%,
                #3f833f 55%,
                #5f9f55 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;
            font-size: 42px;
            font-weight: bold;
        }

        //
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 90px;
        }

        .button-title {
            color: black;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: -5px;
        }

        //
        .youtube-box,
        .second-box {
            width: 280px;
            height: 140px;
            background: #718b78;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .youtube-box:hover,
        .second-box:hover {
            transform: scale(1.05);
            background: #809b87;
        }

        //
        .second-box {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="top">
        <div class="title">SlimeManMillerVR</div>
    </div>

    <div class="buttons">

        <div class="button-title">YOUTUBE</div>

        <a href="https://www.youtube.com/@SlimeManMillerVR" target="_blank">
            <div class="youtube-box"></div>
        </a>

        <div class="second-box"></div>

    </div>

</body>
</html>
