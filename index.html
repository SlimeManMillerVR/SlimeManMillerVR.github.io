<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #5f9f55;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .top {
            height: 25vh;
            background: #286b32;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;
            font-size: 42px;
            font-weight: bold;
        }

        .youtube-box {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 140px;
            background: #718b78;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .youtube-box:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>

<body>

    <div class="top">
        <div class="title">SlimeManMillerVR</div>
    </div>

    <a href="https://www.youtube.com/@SlimeManMillerVR" target="_blank">
        <div class="youtube-box"></div>
    </a>

</body>
</html>
