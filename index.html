<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #5f9f55;
        }

        /*  */
        .top {
            height: 35vh;
            background: linear-gradient(
                to bottom,
                #205f2c 0%,
                #286b32 25%,
                #3f833f 55%,
                #5f9f55 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;
            font-size: 42px;
            font-weight: bold;
        }

        /* */
        .buttons {
            min-height: 30vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 90px 0;
        }

        .button {
            width: 280px;
            height: 140px;
            background: #718b78;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #809b87;
        }

        /*  */
        .bottom {
            height: 35vh;
            background: linear-gradient(
                to bottom,
                #5f9f55 0%,
                #3f833f 45%,
                #286b32 75%,
                #205f2c 100%
            );
        }
    </style>
</head>

<body>

    <!--  -->
    <div class="top">
        <div class="title">SlimeManMillerVR</div>
    </div>

    <!--  -->
    <div class="buttons">

        <!-- YOUTUBE -->
        <a
            class="button"
            href="https://www.youtube.com/@SlimeManMillerVR"
            target="_blank"
            rel="noopener noreferrer"
        >
            YOUTUBE
        </a>

        <!-- DISCORD -->
        <a
            class="button"
            href="https://discord.gg/uGurHm6sd"
            target="_blank"
            rel="noopener noreferrer"
        >
            DISCORD
        </a>

    </div>

    <!--  -->
    <div class="bottom"></div>

</body>
</html>
